<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Scroll Animation - Experience 3D</title>
    <style>
        body { 
            margin: 0; 
            background: #050505;
            color: white;
            font-family: 'Inter', -apple-system, sans-serif;
            overflow-x: hidden;
        }

        canvas {
            position: fixed;
            top: 0;
            left: 0;
            z-index: -1;
            pointer-events: none;
        }

        section {
            height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 0 10%;
            box-sizing: border-box;
            mix-blend-mode: difference;
        }

        h2 {
            font-size: clamp(3rem, 10vw, 8rem);
            margin: 0;
            text-transform: uppercase;
            font-weight: 900;
            letter-spacing: -2px;
            line-height: 0.9;
        }

        p {
            font-size: 1.2rem;
            opacity: 0.6;
            max-width: 400px;
            text-align: center;
            margin-top: 20px;
        }

        .scroll-indicator {
            position: fixed;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%);
            font-size: 0.7rem;
            letter-spacing: 3px;
            opacity: 0.3;
            text-transform: uppercase;
        }
    </style>
</head>
<body>
    <canvas id="webgl"></canvas>

    <section>
        <h2>DÉCOUVRIR</h2>
        <p>L'immersion commence ici. Un objet pur dans un vide infini.</p>
    </section>

    <section>
        <h2>EXPLORER</h2>
        <p>La perspective change. Chaque angle révèle une nouvelle facette.</p>
    </section>

    <section>
        <h2>ACHETER</h2>
        <p>Prenez le contrôle. La perfection sous toutes ses formes.</p>
    </section>

    <div class="scroll-indicator">Scroll pour naviguer</div>

    <script type="importmap">
        {
            "imports": {
                "three": "https://unpkg.com/three@0.160.0/build/three.module.js"
            }
        }
    </script>
    <script type="module">
        import * as THREE from 'three';

        // SCENE SETUP
        const scene = new THREE.Scene();
        const camera = new THREE.PerspectiveCamera(50, window.innerWidth / window.innerHeight, 0.1, 1000);
        camera.position.z = 4;

        const canvas = document.querySelector('#webgl');
        const renderer = new THREE.WebGLRenderer({ 
            canvas,
            antialias: true, 
            alpha: true 
        });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));

        // LIGHTS
        scene.add(new THREE.AmbientLight(0xffffff, 0.5));
        const dirLight = new THREE.DirectionalLight(0x00ffcc, 2);
        dirLight.position.set(2, 2, 5);
        scene.add(dirLight);

        const purpleLight = new THREE.PointLight(0xff00ff, 50);
        purpleLight.position.set(-3, -2, 2);
        scene.add(purpleLight);

        // OBJECT
        const geometry = new THREE.TorusKnotGeometry(0.7, 0.25, 128, 32);
        const material = new THREE.MeshPhysicalMaterial({
            color: 0xffffff,
            metalness: 0.9,
            roughness: 0.1,
            clearcoat: 1.0,
            clearcoatRoughness: 0.1,
            reflectivity: 1.0
        });
        const object = new THREE.Mesh(geometry, material);
        scene.add(object);

        // SCROLL STATES
        const states = [
            { posX: 0, posY: 0, rotX: 0, rotY: 0, scale: 1 },
            { posX: 2, posY: 0, rotX: Math.PI * 0.5, rotY: Math.PI * 0.2, scale: 0.8 },
            { posX: -2, posY: 0, rotX: Math.PI, rotY: Math.PI * 1.5, scale: 1.2 }
        ];

        // SCROLL TRACKING
        let targetScroll = 0;
        let currentScroll = 0;

        window.addEventListener('scroll', () => {
            targetScroll = window.scrollY;
        });

        // ANIMATION LOOP
        function animate() {
            requestAnimationFrame(animate);

            // Lerp scroll for smoothness
            currentScroll += (targetScroll - currentScroll) * 0.08;

            // Calculate section info
            const sectionHeight = window.innerHeight;
            const scrollIndex = currentScroll / sectionHeight;
            
            // Clamp index to array bounds
            const index = Math.max(0, Math.min(states.length - 2, Math.floor(scrollIndex)));
            const progress = Math.max(0, Math.min(1, scrollIndex - index));

            // Interpolate between states[index] and states[index + 1]
            const s1 = states[index];
            const s2 = states[index + 1];

            if (s1 && s2) {
                object.position.x = s1.posX + (s2.posX - s1.posX) * progress;
                object.position.y = s1.posY + (s2.posY - s1.posY) * progress;
                
                object.rotation.x = s1.rotX + (s2.rotX - s1.rotX) * progress + (currentScroll * 0.0005); // Add idle rotation
                object.rotation.y = s1.rotY + (s2.rotY - s1.rotY) * progress + (currentScroll * 0.001);
                
                const s = s1.scale + (s2.scale - s1.scale) * progress;
                object.scale.set(s, s, s);
            }

            renderer.render(scene, camera);
        }

        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });

        animate();
    </script>
</body>
</html>
