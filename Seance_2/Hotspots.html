<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hotspots Interactifs - Modèle 3D</title>
    <style>
        body { 
            margin: 0; 
            overflow: hidden; 
            background: #0a0a0a;
            color: white;
            font-family: 'Inter', -apple-system, sans-serif;
        }

        #ui {
            position: absolute;
            top: 30px;
            left: 30px;
            pointer-events: none;
            z-index: 10;
        }

        h1 { margin: 0; font-size: 1.8rem; font-weight: 200; letter-spacing: 4px; color: #fff; }
        p { opacity: 0.5; font-size: 0.8rem; margin-top: 5px; }

        /* Style des Hotspots */
        .hotspot {
            position: absolute;
            transform: translate(-50%, -50%);
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.2);
            color: white;
            padding: 10px 20px;
            border-radius: 30px;
            font-size: 12px;
            font-weight: 500;
            pointer-events: none;
            opacity: 0;
            transition: opacity 0.3s, transform 0.3s;
            white-space: nowrap;
            display: flex;
            align-items: center;
            gap: 10px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
        }

        .hotspot.visible {
            opacity: 1;
            transform: translate(-50%, -50%) scale(1);
        }

        /* Le petit point blanc */
        .hotspot::before {
            content: '';
            width: 8px;
            height: 8px;
            background: #00ffcc;
            border-radius: 50%;
            display: inline-block;
            box-shadow: 0 0 10px #00ffcc;
            animation: pulse 2s infinite;
        }

        @keyframes pulse {
            0% { transform: scale(1); opacity: 1; }
            50% { transform: scale(1.5); opacity: 0.5; }
            100% { transform: scale(1); opacity: 1; }
        }

        #debug-info {
            position: absolute;
            bottom: 20px;
            right: 20px;
            background: rgba(0,0,0,0.7);
            padding: 10px;
            border-radius: 8px;
            font-family: monospace;
            font-size: 11px;
            color: #00ffcc;
            pointer-events: none;
        }
    </style>
</head>
<body>
    <div id="ui">
        <h1>SESSION 2.2</h1>
        <p>HOTSPOTS INTERACTIFS SUR PRODUIT</p>
    </div>

    <div id="debug-info">Console (F12) : Cliquez sur le modèle pour obtenir les coordonnées 3D</div>

    <!-- Labels HTML -->
    <div class="hotspot" id="hotspot1">Semelle Ultra-Réactive</div>
    <div class="hotspot" id="hotspot2">Tissu Respirant Primeknit</div>
    <div class="hotspot" id="hotspot3">Stabilisateur Talon Carbon</div>

    <script type="importmap">
        {
            "imports": {
                "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
                "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
            }
        }
    </script>
    <script type="module">
        import * as THREE from 'three';
        import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';

        // SCENE SETUP
        const scene = new THREE.Scene();
        const camera = new THREE.PerspectiveCamera(35, window.innerWidth / window.innerHeight, 0.1, 1000);
        camera.position.set(0, 0.2, 0.8);

        const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
        document.body.appendChild(renderer.domElement);

        // LIGHTS
        scene.add(new THREE.AmbientLight(0xffffff, 1));
        const spotLight = new THREE.SpotLight(0xffffff, 5);
        spotLight.position.set(5, 5, 5);
        scene.add(spotLight);

        // MODEL LOADING
        const loader = new GLTFLoader();
        let model;
        loader.load(
            'https://raw.githubusercontent.com/KhronosGroup/glTF-Sample-Models/main/2.0/MaterialsVariantsShoe/glTF/MaterialsVariantsShoe.gltf',
            (gltf) => {
                model = gltf.scene;
                // Center and scale slightly
                model.scale.set(1.5, 1.5, 1.5);
                scene.add(model);
            }
        );

        // HOTSPOTS CONFIG
        const hotspots = [
            { position: new THREE.Vector3(0, 0.08, 0.05), el: document.getElementById('hotspot1') },
            { position: new THREE.Vector3(-0.1, 0.05, 0.1), el: document.getElementById('hotspot2') },
            { position: new THREE.Vector3(0.15, 0.08, -0.05), el: document.getElementById('hotspot3') }
        ];

        // MOUSE ROTATION LOGIC
        let targetRotation = 0;
        let currentRotation = 0;
        document.addEventListener('mousemove', (e) => {
            targetRotation = (e.clientX / window.innerWidth - 0.5) * 2;
        });

        // COORDINATE FINDER (DEBUG TOOL)
        const raycaster = new THREE.Raycaster();
        const mouse = new THREE.Vector2();

        window.addEventListener('click', (event) => {
            if (!model) return;
            
            mouse.x = (event.clientX / window.innerWidth) * 2 - 1;
            mouse.y = -(event.clientY / window.innerHeight) * 2 + 1;

            raycaster.setFromCamera(mouse, camera);
            const intersects = raycaster.intersectObject(model, true);

            if (intersects.length > 0) {
                const point = intersects[0].point;
                // Convert back to local coordinates if needed, or use world point
                // For this exercise, world point is easier to log
                console.log('%c Position cliquée 3D :', 'background: #00ffcc; color: black; padding: 2px 5px; border-radius: 3px;');
                console.log(`new THREE.Vector3(${point.x.toFixed(3)}, ${point.y.toFixed(3)}, ${point.z.toFixed(3)})`);
            }
        });

        // ANIMATION
        function animate() {
            requestAnimationFrame(animate);

            if (model) {
                // Smooth rotation lerp
                currentRotation += (targetRotation - currentRotation) * 0.05;
                model.rotation.y = currentRotation;

                // Update Hotspots
                hotspots.forEach(({ position, el }) => {
                    // Clone to avoid modifying original
                    const worldPos = position.clone();
                    
                    // Apply model rotation to the position
                    worldPos.applyMatrix4(model.matrixWorld);
                    
                    // Project to 2D
                    const screenPos = worldPos.project(camera);

                    // Convert to pixel coordinates
                    const x = (screenPos.x * 0.5 + 0.5) * window.innerWidth;
                    const y = (-screenPos.y * 0.5 + 0.5) * window.innerHeight;

                    el.style.left = `${x}px`;
                    el.style.top = `${y}px`;

                    // Visibility logic (hide if behind the model or outside camera view)
                    if (screenPos.z > 1) {
                        el.classList.remove('visible');
                    } else {
                        el.classList.add('visible');
                    }
                });
            }

            renderer.render(scene, camera);
        }

        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });

        animate();
    </script>
</body>
</html>
